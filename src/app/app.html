<div class="app-shell">
  <app-header></app-header>
  <app-navbar></app-navbar>

  <main class="app-content">
    <app-home></app-home>

    @if (alertMessage()) {
      <div class="alert alert-warning alert-dismissible fade show m-3" role="alert">
        {{ alertMessage() }}
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="dismissAlert()"
        ></button>
      </div>
    }

    <section class="favorites-panel m-3">
      <h2 class="h5">Mes favoris</h2>
      @if (favorites().length) {
        <ul class="list-group">
          @for (conf of favorites(); track conf.id) {
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span>{{ conf.titre | uppercase }}</span>
              <span class="badge text-bg-primary">{{ conf.category }}</span>
            </li>
          }
        </ul>
      } @else {
        <p class="mb-0">Aucun favori pour le moment.</p>
      }
    </section>

    <app-conferencelist
      [favorites]="favorites()"
      (favoriteAdded)="addToFavorites($event)"
    ></app-conferencelist>
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
